<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Rule-based and Clef household decisions in a small sandbox</title>
  <desc id="chart-description">Clef creates 285 applications and 21 approvals compared with 228 applications and 11 approvals under the rules. Both simulations complete two sales.</desc>
  <rect width="1120" height="700" rx="20" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.7px; }
    .subtitle { font-size: 16px; fill: #64748b; }
    .panel-title { font-size: 21px; font-weight: 700; }
    .label { font-size: 14px; fill: #64748b; }
    .value { font-size: 17px; font-weight: 700; }
    .tick { font-size: 12px; fill: #64748b; }
  </style>
  <text x="54" y="52" class="title">Clef agents submitted more applications in the sandbox</text><text x="54" y="82" class="subtitle">This 60-household test is separate from the UK data backtest. Both runs use the same seed and scenario.</text><line x1="54" y1="106" x2="82" y2="106" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><text x="92" y="111" class="label">Rules</text><line x1="159" y1="106" x2="187" y2="106" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><text x="197" y="111" class="label">Clef</text><text x="54" y="155" class="panel-title">Applications</text><line x1="54" y1="308" x2="354" y2="308" stroke="#dbe3ee" stroke-width="1"/><rect x="98" y="215.8571428571429" width="80" height="92.14285714285711" rx="6" fill="#64748b"/><text x="138" y="205.8571428571429" class="value" text-anchor="middle">228</text><text x="138" y="332" class="label" text-anchor="middle">Rules</text><rect x="218" y="192.8214285714286" width="80" height="115.17857142857139" rx="6" fill="#7c3aed"/><text x="258" y="182.8214285714286" class="value" text-anchor="middle">285</text><text x="258" y="332" class="label" text-anchor="middle">Clef</text><text x="410" y="155" class="panel-title">Approvals</text><line x1="410" y1="308" x2="710" y2="308" stroke="#dbe3ee" stroke-width="1"/><rect x="454" y="247.6683673469388" width="80" height="60.331632653061206" rx="6" fill="#64748b"/><text x="494" y="237.6683673469388" class="value" text-anchor="middle">11</text><text x="494" y="332" class="label" text-anchor="middle">Rules</text><rect x="574" y="192.82142857142858" width="80" height="115.17857142857142" rx="6" fill="#7c3aed"/><text x="614" y="182.82142857142858" class="value" text-anchor="middle">21</text><text x="614" y="332" class="label" text-anchor="middle">Clef</text><text x="766" y="155" class="panel-title">Completed sales</text><line x1="766" y1="308" x2="1066" y2="308" stroke="#dbe3ee" stroke-width="1"/><rect x="810" y="192.82142857142858" width="80" height="115.17857142857142" rx="6" fill="#64748b"/><text x="850" y="182.82142857142858" class="value" text-anchor="middle">2</text><text x="850" y="332" class="label" text-anchor="middle">Rules</text><rect x="930" y="192.82142857142858" width="80" height="115.17857142857142" rx="6" fill="#7c3aed"/><text x="970" y="182.82142857142858" class="value" text-anchor="middle">2</text><text x="970" y="332" class="label" text-anchor="middle">Clef</text><text x="54" y="402" class="panel-title">Cumulative applications</text><line x1="120" y1="610" x2="528" y2="610" stroke="#dbe3ee" stroke-width="1"/><text x="108" y="614" class="tick" text-anchor="end">0</text><line x1="120" y1="549.5711500974659" x2="528" y2="549.5711500974659" stroke="#dbe3ee" stroke-width="1"/><text x="108" y="553.5711500974659" class="tick" text-anchor="end">100</text><line x1="120" y1="489.14230019493175" x2="528" y2="489.14230019493175" stroke="#dbe3ee" stroke-width="1"/><text x="108" y="493.14230019493175" class="tick" text-anchor="end">200</text><line x1="120" y1="428.7134502923977" x2="528" y2="428.7134502923977" stroke="#dbe3ee" stroke-width="1"/><text x="108" y="432.7134502923977" class="tick" text-anchor="end">300</text><line x1="120" y1="610" x2="120" y2="615" stroke="#dbe3ee"/><text x="120" y="632" class="tick" text-anchor="middle">0</text><line x1="226.43478260869566" y1="610" x2="226.43478260869566" y2="615" stroke="#dbe3ee"/><text x="226.43478260869566" y="632" class="tick" text-anchor="middle">6</text><line x1="332.8695652173913" y1="610" x2="332.8695652173913" y2="615" stroke="#dbe3ee"/><text x="332.8695652173913" y="632" class="tick" text-anchor="middle">12</text><line x1="439.304347826087" y1="610" x2="439.304347826087" y2="615" stroke="#dbe3ee"/><text x="439.304347826087" y="632" class="tick" text-anchor="middle">18</text><line x1="528" y1="610" x2="528" y2="615" stroke="#dbe3ee"/><text x="528" y="632" class="tick" text-anchor="middle">23</text><path d="M120.00,603.35 L137.74,597.91 L155.48,592.48 L173.22