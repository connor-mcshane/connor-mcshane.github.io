<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">How an interest-rate cut moves through the housing transaction process</title>
  <desc id="chart-description">A time-series chart shows a two-month lag from the Bank Rate cut to mortgage repricing. A funnel shows 1,722 applications becoming 110 approvals, 47 accepted offers and 44 completed sales.</desc>
  <rect width="1120" height="830" rx="20" fill="#ffffff"/>
