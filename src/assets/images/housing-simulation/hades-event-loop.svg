<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">One simulated month in the HADES event loop</title>
  <desc id="chart-description">The calendar publishes MonthStarted, HADES broadcasts it, household processes decide concurrently, the market collects every decision and publishes MarketCleared, then the calendar starts the next month.</desc>
  <rect width="1120" height="510" rx="20" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.7px; }
    .subtitle { font-size: 16px; fill: #64748b; }
    .panel-title { font-size: 21px; font-weight: 700; }
    .label { font-size: 14px; fill: #64748b; }
    .value { font-size: 17px; font-weight: 700; }
    .tick { font-size: 12px; fill: #64748b; }
  </style>
  
    <defs>
      <marker id="event-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
      </marker>
    </defs><text x="54" y="52" class="title">One simulated month in HADES</text><text x="54" y="82" class="subtitle">Processes publish events. HADES broadcasts them; the processes that care about an event react to it.</text><rect x="30" y="142" width="190" height="220" rx="14" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5"/><circle cx="54" cy="168" r="14" fill="#2563eb"/><text x="54" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="78" y="175" class="panel-title">Calendar</text><text x="48" y="225" class="label">Starts the month</text><text x="48" y="249" class="label">and publishes</text><rect x="48" y="282" width="154" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="125" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">MonthStarted</text><line x1="227" y1="252" x2="237" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#event-arrow)"/><rect x="245" y="142" width="190" height="220" rx="14" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5"/><circle cx="269" cy="168" r="14" fill="#2563eb"/><text x="269" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="293" y="175" class="panel-title">HADES</text><text x="263" y="225" class="label">Broadcasts the event</text><text x="263" y="249" class="label">to every process</text><rect x="263" y="282" width="154" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="340" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">Observers react</text><line x1="442" y1="252" x2="452" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#event-arrow)"/><rect x="460" y="142" width="190" height="220" rx="14" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5"/><circle cx="484" cy="168" r="14" fill="#2563eb"/><text x="484" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="508" y="175" class="panel-title">Households</text><text x="478" y="225" class="label">Rules or Clef choose</text><text x="478" y="249" class="label">actions concurrently</text><rect x="478" y="282" width="154" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="555" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">HouseholdDecided × N</text><line x1="657" y1="252" x2="667" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#event-arrow)"/><rect x="675" y="142" width="190" height="220" rx="14" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5"/><circle cx="699" cy="168" r="14" fill="#2563eb"/><text x="699" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="723" y="175" class="panel-title">Market</text><text x="693" y="225" class="label">Collects every decision</text><text x="693" y="249" class="label">then clears the market</text><rect x="693" y="282" width="154" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="770" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">Lend + match</text><line x1="872" y1="252" x2="882" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#event-arrow)"/><rect x="890" y="142" width="190" height="220" rx="14" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5"/><circle cx="914" cy="168" r="14" fill="#2563eb"/><text x="914" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="938" y="175" class="panel-title">Market</text><text x="908" y="225" class="label">Records the results</text><text x="908" y="249" class="label">and publishes</text><rect x="908" y="282" width="154" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="985" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">MarketCleared</text><path d="M 985 374 V 432 H 125 V 375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#event-arrow)"/><text x="560" y="466" class="subtitle" text-anchor="middle">The calendar schedules the next MonthStarted event. Households also store the result in their short memory.</text>
</svg>
